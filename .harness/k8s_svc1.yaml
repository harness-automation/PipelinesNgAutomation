service:
  name: k8s svc1
  identifier: k8s_svc1
  orgIdentifier: default
  projectIdentifier: DoNotDelete_KanikaTest
  serviceDefinition:
    spec:
      manifests:
        - manifest:
            identifier: m1
            type: HelmChart
            spec:
              store:
                type: OciHelmChart
                spec:
                  config:
                    type: ECR
                    spec:
                      connectorRef: account.ECRConnectorForAutomationTest
                      region: us-east-1
                      registryId: ""
                  basePath: /
              chartName: todolist
              subChartPath: ""
              chartVersion: <+input>
              helmVersion: V380
              skipResourceVersioning: false
              enableDeclarativeRollback: false
              fetchHelmChartMetadata: false
              optionalValuesYaml: false
    type: NativeHelm
