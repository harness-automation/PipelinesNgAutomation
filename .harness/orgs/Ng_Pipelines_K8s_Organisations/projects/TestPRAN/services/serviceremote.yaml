service:
  name: serviceremote
  identifier: serviceremote
  orgIdentifier: Ng_Pipelines_K8s_Organisations
  projectIdentifier: TestPRAN
  serviceDefinition:
    spec:
      manifests:
        - manifest:
            identifier: m12
            type: HelmChart
            spec:
              store:
                type: OciHelmChart
                spec:
                  config:
                    type: ECR
                    spec:
                      connectorRef: org.ECRConnectorForAutomationTest
                      region: us-east-1
                      registryId: ""
                  basePath: /
              chartName: todolist
              subChartPath: ""
              chartVersion: <+input>
              helmVersion: V380
              skipResourceVersioning: false
              enableDeclarativeRollback: false
              fetchHelmChartMetadata: false
              optionalValuesYaml: false
    type: Kubernetes
